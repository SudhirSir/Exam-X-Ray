services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: exam-xray-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examxray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examxray}
      POSTGRES_DB: ${POSTGRES_DB:-examxray}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examxray}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exam-xray-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: exam-xray-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: exam-xray-api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-examxray}:${POSTGRES_PASSWORD:-examxray}@postgres:5432/${POSTGRES_DB:-examxray}
      ENABLE_PGVECTOR: "true"
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: exam-xray-documents
      MEDALLION_BASE_DIR: /app/data
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - lakehouse_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: exam-xray-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  airflow:
    image: apache/airflow:2.10.4-python3.12
    container_name: exam-xray-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project:/opt/airflow/project/data-engineering:/opt/airflow/project/apps/api
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-examxray}:${POSTGRES_PASSWORD:-examxray}@postgres:5432/${POSTGRES_DB:-examxray}
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ../../orchestration/airflow/dags:/opt/airflow/dags
      - ../..:/opt/airflow/project
      - lakehouse_data:/opt/airflow/project/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  lakehouse_data:
